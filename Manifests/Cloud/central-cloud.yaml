apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-cloud
  labels:
    app: central-cloud
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: central-cloud
  template:
    metadata:
      name: central-cloud
      labels:
        app: central-cloud
    spec:
      initContainers:
        - name: wait-for-mqtt
          image: busybox:1.36
          # It runs a loop that attempts to connect to port 1883 of the MQTT service
          command:
            - 'sh'
            - '-c'
            - >
              echo "Verify connection broker MQTT...";
              until nc -z mosquitto-service 1883; do
                echo "Broker MQTT not ready, retry in 3 seconds...";
                sleep 3;
              done;
              echo "Broker MQTT ready! Starting of the app.";
        - name: wait-for-mongodb
          image: mongo:latest
          #It runs a loop that tries to ping mongoDB service, waiting for it to start
          command:
            - 'sh'
            - '-c'
            - >
              echo "Verify MongoDB readiness...";
              until mongosh --host mongo-service --port 27017 --eval 'db.adminCommand("ping")' --quiet; do
                echo "MongoDB not ready to accept connections, retry in 3 seconds...";
                sleep 3;
              done;
              echo "MongoDB is fully ready! Starting the app.";
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.kubernetes.io/contrl-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: central-cloud
          image: mronca56/cloud-node-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # Within the cluster, I need to point to the internal services and their names
            - name: MQTT_BROKER_URL
              value: "tcp://mosquitto-service:1883"
            - name: MQTT_CLIENT_ID
              value: "central-cloud-client"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongo-service:27017/factory_db"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: cloud-service
  labels:
    app: central-cloud
spec:
  selector:
    app: central-cloud
  type: NodePort
  ports:
    - port: 8080