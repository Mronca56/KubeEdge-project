apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "" # Only deploy on control plane node
      tolerations:
        - key: "node-role.kubernetes.io/contrl-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: mosquitto
          image: eclipse-mosquitto
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto-cloud.conf
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-conf

# We need the service to expose the broker to the edge in order to communicate
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
spec:
  type: NodePort
  selector:
    app: mosquitto
  ports:
    - port: 1883
      targetPort: 1883
      nodePort: 31883