apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto
          ports:
            - containerPort: 1883
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto-cloud.conf
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-conf

---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
    - port: 1883